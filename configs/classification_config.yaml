# Classification model — FraudDetectionMLP
# Supervised MLP classifier with BCEWithLogitsLoss (binary output)
#
# The encoder architecture (input_dim, hidden_dims) is intentionally NOT
# defined here. It is loaded at runtime from `base_model_config` (config.yaml)
# so that FraudDetectionMLP always uses the exact same encoder structure as
# the contrastive pre-training, enabling correct weight loading.

# Path to the base autoencoder/contrastive config — encoder architecture source
base_model_config: "configs/config.yaml"

model:
  # input_dim and hidden_dims are injected at runtime from base_model_config
  dropout: 0.1
  task: "classification"

test_size: 0.2
val_size: 0.1      # fraction of the full dataset held out for validation
drop_time: true    # consistent with Contrastive_training.py and tune_Autoencoder.py
use_smote: true    # false -> use the original imbalanced dataset + Weighted CrossEntropy

training:
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "adam"
  batch_size: 512
  scheduler:
    type: "reduce_on_plateau"  # reduce LR when val_loss stops improving
    patience: 7                # epochs without improvement before reducing LR
    factor: 0.5                # LR is halved each time
  early_stopping:
    enabled: true
    patience: 20         # epochs without improvement before stopping
    min_delta: 0.0001    # minimum change to qualify as an improvement
  loss: "bce"           # BCEWithLogitsLoss — matches FraudDetectionMLP's single output logit
  val_metric: "f1"       # metric used for checkpointing and early stopping: "f1" | "loss"

classification:
  threshold_method: "f1_optimal"    # percentile | mean_std | f1_optimal
  percentile: 95
  std_multiplier: 2.0
  plots_dir: "plots/classification"
  results_dir: "results/classification"

paths:
  data_dir: "data/"
  checkpoint_dir: "checkpoints/"
  checkpoint_name: "Classifier_best.pt"
  log_dir: "logs/"

seed: 42
device: "cpu"
