model:
  input_dim: 29
  hidden_dims:
  - 24
  - 18
  task: reconstruction
batch_size: 256
test_size: 0.2
val_size: 0
training:
  epochs: 100
  learning_rate: 0.0004993662066506425
  weight_decay: 0.00015061458746961162
  optimizer: adam
  scheduler:
    type: none
    patience: 20
    factor: 0.5
    step_size: 30
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-05
  loss: mse
anomaly:
  threshold_method: f1_optimal
  percentile: 95
  std_multiplier: 2.0
paths:
  data_dir: data/
  checkpoint_dir: checkpoints/
  log_dir: logs/
seed: 42
device: cpu
