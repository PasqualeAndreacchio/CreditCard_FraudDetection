model:
  input_dim: 29
  hidden_dims:
  - 24
  - 18
  task: reconstruction
batch_size: 256
test_size: 0.2
val_size: 0.15
training:
  epochs: 100
  learning_rate: 0.0004993662066506425
  weight_decay: 0.00015061458746961162
  optimizer: adam
  scheduler:
    type: none
    patience: 20
    factor: 0.5
    step_size: 30
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-05
  loss: mse
anomaly:
  threshold_method: f1_optimal
  percentile: 95
  std_multiplier: 2.0
  plots_dir: plots/reconstruction
  results_dir: results/reconstruction
paths:
  data_dir: data/
  checkpoint_dir: checkpoints/
  checkpoint_name: autoencoder_best.pt
  log_dir: logs/
seed: 42
device: cpu
contrastive:
  epochs: 20
  learning_rate: 1.0e-3
  weight_decay: 0.0
  margin: 1.0          # TripletMarginLoss margin
  p: 2                 # Distance norm (p=2 -> Euclidean)
  backbone_save_path: pretrained_tabular_encoder.pth
